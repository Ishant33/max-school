<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Faculty CMS | Max International School</title><link rel="stylesheet" href="cms/admin.css"></head>
<body><header class="admin-head"><strong>Max International School <span>Faculty CMS</span></strong><button id="sign-out" hidden>Sign out</button></header>
<main id="login-view" class="cms-login"><section class="auth-card"><h1>Faculty portal</h1><p>Sign in with your faculty account.</p><div id="login-message" class="alert error" hidden></div><form id="login-form"><label>Email<input type="email" id="email" required autocomplete="email"></label><label>Password<input type="password" id="password" required autocomplete="current-password"></label><button>Sign in</button></form></section></main>
<div id="app-view" class="admin-layout" hidden><aside><p>Faculty dashboard</p><a href="#about" data-module="about" class="selected">About Us</a><a href="#academics" data-module="academics">Academics</a><a href="#admission" data-module="admission">Admission</a><a href="#career" data-module="career">Career</a><a href="#gallery" data-module="gallery">Gallery</a></aside><main><h1 id="module-title">About Us</h1><p class="muted">Create and publish content for the public website.</p><section class="editor"><h2 id="editor-title">Add item</h2><div id="app-message" class="alert error" hidden></div><form id="content-form"><input type="hidden" id="content-id"><label>Title<input id="content-title" required></label><label>Content<textarea id="content-body" rows="5"></textarea></label><label>Image URL <small>(optional)</small><input type="url" id="image-url"></label><label>Or upload image <small>(JPG, PNG, or WebP; max 5 MB)</small><input type="file" id="image-file" accept="image/jpeg,image/png,image/webp"></label><div class="form-row"><label>Display order<input type="number" id="sort-order" value="0"></label><label class="checkbox"><input type="checkbox" id="published" checked> Published</label></div><button>Save item</button><a href="#" id="cancel-edit" class="cancel" hidden>Cancel</a></form></section><section><h2>Saved items</h2><div id="content-list"><p class="empty">Loading…</p></div></section></main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/supabase-config.js"></script><script src="assets/js/supabase-cms.js"></script><script src="assets/js/admin.js"></script></body></html>
